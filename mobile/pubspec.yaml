name: supertarot_mobile
description: SuperTarot - offline tarot reference, study drills, and AI Q&A.
publish_to: 'none'
# Bumped by release-please; the trailing marker is what it looks for.
version: 1.3.0 # x-release-please-version

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    # The launcher icon doubles as the wordmark logo in the app bar.
    - icon/app_icon.png

# Launcher icons are generated from icon/app_icon.png by
# `dart run flutter_launcher_icons`. Re-run it after replacing that file.
#
# The source art is transparent and spans 84% of its canvas, while an adaptive
# icon only guarantees the central 66% is visible. The 16% inset scales the
# foreground to about 57%: clear of any mask, and leaving enough of the
# background visible to read as a coloured icon rather than a full-bleed image.
#
# Background is a warm beige that matches the app's paper surface. It has to
# be deeper than the cream pages in the art (#FDF3DC) or the book loses its
# mass against it: #FFFBF0 sits at 1.07:1 contrast, this at 1.49:1.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#DFC79A"
  adaptive_icon_foreground: "icon/app_icon.png"
  adaptive_icon_foreground_inset: 16
