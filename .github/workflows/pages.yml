name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait rather than cancel: cancelling mid-deploy can
# leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Card JSON, card art and the branding images are generated from
      # data/output and data/images, which are the committed source of truth.
      - name: Build site inputs
        run: python web/tools/prepare_web_assets.py

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Type check
        working-directory: web
        run: npm run check

      - name: Build
        working-directory: web
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
